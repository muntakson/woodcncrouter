<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grbl Sender Backoffice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --panel2: #24282d; --border: #30353b;
    --text: #e3e6ea; --muted: #8b939c; --accent: #4ea1ff;
    --V: #7d858e; --D: #6cc3d5; --I: #b9e3b9; --W: #f0c050; --E: #ff6b6b;
    --ok: #4cd07d;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100% - 45px); }
  aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; background: var(--panel); }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .dev { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--panel2); }
  .dev:hover { border-color: var(--muted); }
  .dev.sel { border-color: var(--accent); }
  .dev .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .dev .meta { color: var(--muted); font-size: 12px; }
  .rel { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .rel .ver { font-size: 18px; font-weight: 600; }
  .rel a.btn { display: block; text-align: center; margin: 8px 0; }
  #qr { background: #fff; padding: 8px; border-radius: 6px; width: fit-content; margin: 8px auto 4px; }
  #qrUrl { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; text-align: center; }
  .old { font-size: 12px; margin-top: 8px; }
  .gf { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .gf .fname { font-family: var(--mono); font-size: 13px; font-weight: 600; word-break: break-all; }
  .gf .meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .gf a.btn { display: block; text-align: center; padding: 10px; font-size: 15px; }
  .gf a.small { color: var(--accent); font-size: 12px; display: inline-block; margin-top: 6px; }
  .old a { color: var(--accent); }
  section.console { display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .lv { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 9px; font: 600 12px var(--mono); cursor: pointer; }
  .lv.on { color: var(--bg); }
  .lv.on[data-l=V] { background: var(--V); } .lv.on[data-l=D] { background: var(--D); }
  .lv.on[data-l=I] { background: var(--I); } .lv.on[data-l=W] { background: var(--W); }
  .lv.on[data-l=E] { background: var(--E); }
  input[type=search] { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 9px; min-width: 200px; }
  button, a.btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 11px; cursor: pointer; font: inherit; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--muted); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.chk { color: var(--muted); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
  #log { flex: 1; overflow-y: auto; font: 12.5px/1.45 var(--mono); padding: 6px 0; }
  .row { display: grid; grid-template-columns: 96px 18px 70px 1fr; gap: 8px; padding: 1px 12px; white-space: pre-wrap; word-break: break-word; }
  .row.all { grid-template-columns: 96px 70px 18px 70px 1fr; }
  .row:hover { background: var(--panel2); }
  .row .t, .row .d { color: var(--muted); }
  .row .g { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row[data-l=V] .m { color: var(--V); } .row[data-l=D] .m { color: var(--D); }
  .row[data-l=I] .m { color: var(--I); } .row[data-l=W] .m { color: var(--W); }
  .row[data-l=E] .m { color: var(--E); } .row[data-l=E] { background: rgba(255,107,107,.06); }
  .row .l { font-weight: 700; }
  .row[data-l=E] .l { color: var(--E); } .row[data-l=W] .l { color: var(--W); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  #more { margin: 6px 12px; }
  .status { color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
    .row, .row.all { grid-template-columns: 80px 14px 1fr; }
    .row .g, .row .d { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Grbl Sender · Backoffice</h1>
  <span class="live"><span id="liveDot" class="dot"></span><span id="liveTxt">connecting…</span></span>
  <span class="spacer"></span>
  <span class="status" id="count"></span>
</header>
<main>
  <aside>
    <h2>Latest APK</h2>
    <div class="rel" id="release"><div class="empty">No release published</div></div>

    <h2>G-code files</h2>
    <div id="gcode"><div class="empty">No G-code files</div></div>

    <h2>Devices</h2>
    <div class="dev sel" data-id="" id="allDev"><div class="name">All devices</div></div>
    <div id="devices"></div>
  </aside>

  <section class="console">
    <div class="toolbar">
      <span>
        <button class="lv on" data-l="V">V</button>
        <button class="lv on" data-l="D">D</button>
        <button class="lv on" data-l="I">I</button>
        <button class="lv on" data-l="W">W</button>
        <button class="lv on" data-l="E">E</button>
      </span>
      <input type="search" id="q" placeholder="Filter text / tag…">
      <label class="chk"><input type="checkbox" id="follow" checked> Follow</label>
      <button id="pause">Pause</button>
      <span class="spacer"></span>
      <button id="export">Export .txt</button>
      <button id="clear">Clear logs</button>
    </div>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const logEl = $('#log');
const state = { device: '', levels: new Set('VDIWE'), q: '', paused: false, rows: [], devices: [], maxId: 0, minId: 0 };
const MAX_ROWS = 5000;

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}
function ago(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return new Date(ts).toLocaleString();
}
function devName(id) {
  const d = state.devices.find((x) => x.id === id);
  return d ? (d.model || id.slice(0, 8)) : id.slice(0, 8);
}
function matches(r) {
  if (state.device && r.device_id !== state.device) return false;
  if (!state.levels.has(r.level)) return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    if (!r.msg.toLowerCase().includes(q) && !r.tag.toLowerCase().includes(q)) return false;
  }
  return true;
}
function rowEl(r) {
  const div = document.createElement('div');
  div.className = 'row' + (state.device ? '' : ' all');
  div.dataset.l = r.level;
  const cells = [['t', fmtTime(r.ts)]];
  if (!state.device) cells.push(['d', devName(r.device_id)]);
  cells.push(['l', r.level], ['g', r.tag], ['m', r.msg]);
  for (const [c, txt] of cells) {
    const s = document.createElement('span');
    s.className = c; s.textContent = txt;
    if (c === 'g') s.title = txt;
    div.appendChild(s);
  }
  return div;
}
function render() {
  logEl.textContent = '';
  const visible = state.rows.filter(matches);
  if (state.minId > 1) {
    const b = document.createElement('button');
    b.id = 'more'; b.textContent = 'Load older';
    b.onclick = loadOlder;
    logEl.appendChild(b);
  }
  if (!visible.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'No log lines yet. Open Grbl Sender on the tablet.';
    logEl.appendChild(e);
  }
  const frag = document.createDocumentFragment();
  for (const r of visible) frag.appendChild(rowEl(r));
  logEl.appendChild(frag);
  $('#count').textContent = `${visible.length} lines shown`;
  if ($('#follow').checked) logEl.scrollTop = logEl.scrollHeight;
}
function append(rows) {
  if (state.paused) { state.buffer = (state.buffer || []).concat(rows); $('#pause').textContent = `Resume (${state.buffer.length})`; return; }
  state.rows.push(...rows);
  for (const r of rows) state.maxId = Math.max(state.maxId, r.id);
  if (state.rows.length > MAX_ROWS) { state.rows.splice(0, state.rows.length - MAX_ROWS); render(); return; }
  const empty = logEl.querySelector('.empty');
  if (empty) empty.remove();
  const frag = document.createDocumentFragment();
  for (const r of rows) if (matches(r)) frag.appendChild(rowEl(r));
  logEl.appendChild(frag);
  if ($('#follow').checked) logEl.scrollTop = logEl.scrollHeight;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadLogs() {
  const qs = new URLSearchParams({ limit: 1000 });
  if (state.device) qs.set('device', state.device);
  state.rows = await api('/api/logs?' + qs);
  state.maxId = state.rows.reduce((m, r) => Math.max(m, r.id), state.maxId);
  state.minId = state.rows.length ? state.rows[0].id : 0;
  render();
}
async function loadOlder() {
  const qs = new URLSearchParams({ limit: 1000, before: state.minId });
  if (state.device) qs.set('device', state.device);
  const older = await api('/api/logs?' + qs);
  if (!older.length) { state.minId = 0; render(); return; }
  state.rows = older.concat(state.rows);
  state.minId = older[0].id;
  const follow = $('#follow').checked;
  $('#follow').checked = false;
  render();
  $('#follow').checked = follow;
}
async function loadDevices() {
  state.devices = await api('/api/devices');
  const box = $('#devices');
  box.textContent = '';
  for (const d of state.devices) {
    const el = document.createElement('div');
    el.className = 'dev' + (state.device === d.id ? ' sel' : '');
    el.dataset.id = d.id;
    const online = Date.now() - d.last_seen < 30000;
    el.innerHTML = `<div class="name"><span class="dot ${online ? 'on' : ''}"></span><span></span></div>
      <div class="meta"></div><div class="meta"></div><div class="meta"></div>`;
    el.querySelector('.name span:last-child').textContent = `${d.manufacturer || ''} ${d.model || d.id.slice(0, 8)}`.trim();
    const metas = el.querySelectorAll('.meta');
    metas[0].textContent = `Android ${d.android ?? '?'} (SDK ${d.sdk ?? '?'}) · ${d.ip || ''}`;
    metas[1].textContent = `App ${d.app_version ?? '?'} (${d.app_code ?? '?'}) · ${d.log_count} lines`;
    metas[2].textContent = `Last seen ${ago(d.last_seen)}`;
    el.onclick = () => selectDevice(d.id);
    box.appendChild(el);
  }
  $('#allDev').classList.toggle('sel', !state.device);
}
function selectDevice(id) {
  state.device = id;
  loadDevices();
  loadLogs();
}
$('#allDev').onclick = () => selectDevice('');

async function loadGcode() {
  const files = await fetch('/api/gcode').then((r) => r.json());
  const box = $('#gcode');
  if (!files.length) return;
  box.textContent = '';
  for (const f of files) {
    const el = document.createElement('div');
    el.className = 'gf';
    el.innerHTML = `<div class="fname"></div><div class="meta"></div>
      <a class="btn primary" download>⬇ Download</a>`;
    el.querySelector('.fname').textContent = f.name;
    el.querySelector('.meta').textContent = `${(f.size / 1024).toFixed(0)} KB · ${new Date(f.modified).toLocaleString()}` + (f.title ? ` · ${f.title}` : '');
    const a = el.querySelector('a.btn');
    a.href = '/gcode/' + encodeURIComponent(f.name);
    a.setAttribute('download', f.name);
    if (f.preview) {
      const p = document.createElement('a');
      p.className = 'small'; p.href = '/gcode/' + encodeURIComponent(f.preview); p.target = '_blank';
      p.textContent = 'Preview image';
      el.appendChild(p);
    }
    box.appendChild(el);
  }
}

async function loadReleases() {
  const rels = await api('/api/releases');
  const box = $('#release');
  if (!rels.length) return;
  const latest = rels[0];
  const dl = `${location.protocol}//${location.host}/apk/latest.apk`;
  box.innerHTML = `<div class="ver"></div><div class="meta status"></div>
    <a class="btn primary" href="/apk/latest.apk">Download APK</a>
    <div id="qr"></div><div id="qrUrl"></div><div class="old"></div>`;
  box.querySelector('.ver').textContent = `v${latest.versionName} (${latest.versionCode})`;
  box.querySelector('.meta').textContent = `${new Date(latest.published).toLocaleString()} · ${(latest.size / 1024).toFixed(0)} KB` + (latest.notes ? ` · ${latest.notes}` : '');
  $('#qrUrl').textContent = dl;
  if (window.QRCode) new QRCode($('#qr'), { text: dl, width: 150, height: 150 });
  else $('#qr').remove();
  const old = box.querySelector('.old');
  for (const r of rels.slice(1, 6)) {
    const a = document.createElement('a');
    a.href = `/apk/${r.file}`; a.textContent = `v${r.versionName} (${r.versionCode})`;
    old.appendChild(a); old.appendChild(document.createTextNode('  '));
  }
}

function connectStream() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('#liveDot').classList.add('on'); $('#liveTxt').textContent = 'live'; };
  es.onerror = () => { $('#liveDot').classList.remove('on'); $('#liveTxt').textContent = 'reconnecting…'; };
  es.onmessage = (ev) => {
    const rows = JSON.parse(ev.data);
    if (rows.some((r) => !state.devices.find((d) => d.id === r.device_id))) loadDevices();
    append(rows);
  };
}

document.querySelectorAll('.lv').forEach((b) => b.onclick = () => {
  const l = b.dataset.l;
  if (state.levels.has(l)) state.levels.delete(l); else state.levels.add(l);
  b.classList.toggle('on');
  render();
});
let qTimer;
$('#q').oninput = (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 150); };
$('#pause').onclick = () => {
  state.paused = !state.paused;
  $('#pause').textContent = state.paused ? 'Resume' : 'Pause';
  if (!state.paused && state.buffer) { const b = state.buffer; state.buffer = null; append(b); }
};
$('#clear').onclick = async () => {
  const what = state.device ? `logs of ${devName(state.device)}` : 'ALL logs';
  if (!confirm(`Delete ${what} from the server?`)) return;
  await api('/api/logs' + (state.device ? '?device=' + encodeURIComponent(state.device) : ''), { method: 'DELETE' });
  state.rows = []; state.minId = 0; render(); loadDevices();
};
$('#export').onclick = () => {
  const txt = state.rows.filter(matches).map((r) =>
    `${new Date(r.ts).toISOString()} ${devName(r.device_id)} ${r.level}/${r.tag}: ${r.msg}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = `grblsender-log-${new Date().toISOString().slice(0, 19).replace(/:/g, '')}.txt`;
  a.click();
};

loadDevices().then(loadLogs);
loadReleases();
loadGcode();
connectStream();
setInterval(loadDevices, 10000);
</script>
</body>
</html>
